name: Daily Ingest

# Runs the daily Statcast pull, weather refresh, and picks snapshot.
# Schedule: 14:00 UTC = 10am ET during DST, 9am ET in standard time.
# Both windows are well before MLB lineups lock (~5pm ET first pitch).
on:
  schedule:
    - cron: '0 14 * * *'
  # Allow manual triggering from the GitHub UI
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache pybaseball data
        uses: actions/cache@v4
        with:
          path: ~/.cache/pybaseball
          # Primary key is unique per run so it always saves a fresh entry.
          # restore-keys falls back to the most recent matching cache from any prior run.
          key: pybaseball-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            pybaseball-${{ runner.os }}-

      - name: Run daily ingest
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: python -m app.cron
